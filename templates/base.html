<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Todo リスト{% endblock %}</title>
  <style>
    /* 全体の見た目 */
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif;
           background: #f5f5f4; color: #1c1917; }
    header { background: #0f766e; color: #fff; padding: 14px 16px; }
    header a { color: #fff; text-decoration: none; font-weight: bold; font-size: 1.2rem; }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    .btn { display: inline-block; background: #0f766e; color: #fff; border: none;
           padding: 10px 18px; border-radius: 8px; text-decoration: none; font-size: 1rem;
           cursor: pointer; }
    .btn.sub { background: #e7e5e4; color: #1c1917; }
    .card { background: #fff; border-radius: 10px; padding: 14px 16px; margin: 12px 0;
            box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .card h2 { margin: 0 0 6px; font-size: 1.1rem; }
    .due { font-size: .9rem; color: #57534e; }
    .over .due { color: #b91c1c; font-weight: bold; }
    .body { white-space: pre-wrap; margin: 8px 0; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    label { display: block; font-weight: bold; margin: 14px 0 6px; }
    input, textarea { width: 100%; padding: 10px; font-size: 1rem; border: 1px solid #d6d3d1;
                      border-radius: 8px; font-family: inherit; }
    textarea { min-height: 120px; }
    .errors { background: #fee2e2; color: #991b1b; padding: 10px 14px; border-radius: 8px; }
    .empty { color: #78716c; text-align: center; padding: 40px 0; }
  </style>
</head>
<body>
  <header><a href="{{ url_for('index') }}">Todo リスト</a></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
